[workspace]
members = ["crates/luxforge-raw", "crates/luxforge-process", "crates/luxforge-input", "crates/luxforge-jpeg", "crates/luxforge-core", "crates/luxforge-net", "crates/luxforge-ui", "crates/luxforge-app", "crates/luxforge-cli", "crates/luxforge-evidence", "crates/luxforge-reference", "crates/luxforge-testbase", "crates/luxforge-testkit", "xtask"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.94"
publish = false

[workspace.dependencies]
# PNG only: evidence captures and test images. JPEG is read and written by libjpeg-turbo below; the
# tests, the reference crate and xtask add `jpeg` for themselves, as an independent decoder.
image = { version = "=0.25.9", default-features = false, features = ["png"] }
moxcms = { version = "=0.7.11", default-features = false }
# The one JPEG codec, for importing originals and writing exports, named only by `luxforge-jpeg`:
# libjpeg-turbo as bundled by `mozjpeg-sys`, built from its source with `cc`. `with_simd` is NEON on
# aarch64 through the C compiler; x86_64 SIMD would need NASM, which `nasm_simd` is not asked for,
# so x86_64 builds the portable C path. The crate itself turns on `unwinding`, which lets libjpeg's
# errors unwind to Rust instead of aborting.
mozjpeg = { version = "=0.10.13", default-features = false, features = ["with_simd"] }
# `mozjpeg`'s own C bindings, the package it already builds, named for the decoder's error manager,
# which `mozjpeg` accepts but does not export, and for libjpeg's warning codes, which that manager
# classifies so that a warning standing for lost data stops a decode.
mozjpeg-sys = { version = "=2.2.3", default-features = false }
iced = { version = "=0.14.0", default-features = false, features = ["advanced", "wgpu", "canvas", "image-without-codecs", "sysinfo", "tokio", "x11", "wayland"] }
# The exact `tokio` Iced's executor runs on, for the desktop's job readers: a stream that waits for
# its interval's next tick creates that timer on the runtime the subscription runs on, where Iced's
# own `time::every` can only send a message for each tick. It is the version already in the
# lockfile with the `time` feature Iced's `tokio` feature already turns on, so it adds no package.
tokio = { version = "=1.53.1", default-features = false, features = ["time"] }
rfd = { version = "=0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }
rayon = "=1.12.0"
# An independent EXIF reader and writer for the export metadata tests only. Already in the lockfile
# through Iced, pinned to that version so the tests add no package.
kamadak-exif = "=0.6.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
# Parses Lightroom XMP presets. Already in the lockfile through the Iced text stack, pinned to that
# version so the importer adds no package.
roxmltree = "=0.20.0"
# The module transport's TLS: the `ring` provider only (no aws-lc-rs or CMake), TLS 1.2 and 1.3,
# and the operating system's own certificate verifier for platform trust.
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.0"
# The module transport's HTTP/1.1: `ureq`'s agent, one per request, on the transport's own
# resolver, socket and rustls session. No features, so no TLS stack, gzip, cookies or SOCKS of its
# own; the agent is built with no proxy, no pool and no redirect following.
ureq = { version = "=3.4.2", default-features = false }
# `ureq`'s protocol crate, the one `ureq` already builds, named by the transport only to tell a
# response with too many header fields from other malformed ones.
ureq-proto = { version = "=0.6.4", default-features = false, features = ["client"] }
# The IDNA back end of `url`, pinned to the release without Unicode data: a non-ASCII host is
# refused while its punycode form (`xn--…`) is accepted, and no ICU4X normalizer comes with URL
# parsing. Named here only for the pin; no code uses it.
idna_adapter = "=1.0.0"
# The macOS Keychain for module secrets. Only the keychain item APIs are used, so no TLS feature is
# asked for.
security-framework = { version = "=3.7.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
# `float_roundtrip` reads a stored `f64` back bit-exact: without it, some 17-digit doubles a RAW
# tint or a recipe field stores parse one ulp off.
serde_json = { version = "=1.0.149", features = ["float_roundtrip"] }
# Pinned to 0.10.9, not 0.11: 0.11 would drop `{:x}` on a digest (its `hybrid-array` output has no
# `LowerHex`), which 83 call sites in 36 files use. 0.10.9 builds its aarch64 SHA-2 backend only
# with the `asm` feature, so every crate that names `sha2` also turns `asm` on for aarch64 outside
# Windows, in a target table of its own manifest (as in `crates/luxforge-raw/Cargo.toml`), so that
# every build of any of them resolves the same features. That is the only place `asm` is wanted:
# x86 uses SHA-NI without it, and the `sha2-asm` crate it pulls in refuses to build for Windows. See
# docs/design/efficiency.md#build-and-dependencies.
sha2 = "=0.10.9"
# Reads an Omarchy theme's `colors.toml` and `alacritty.toml` as data. Already in the lockfile
# through `proc-macro-crate`, pinned to that version with its parser only (no `display`, whose
# writer is not in the lockfile), so it adds no package. It enters the shipped binary, and the
# package inventory keeps its licence with every other crate's.
toml_edit = { version = "=0.25.15", default-features = false, features = ["parse"] }
url = "=2.5.8"
uuid = { version = "=1.26.1", features = ["v4"] }
# Zeroes a module secret's buffer when the value is dropped.
zeroize = "=1.9.0"
# The exact `wgpu` Iced 0.14 resolves to, for the photo surface's own shader primitive. Iced 0.14
# does not re-export it (`iced::widget::renderer` is hidden), so it is named here and pinned to the
# version already in the lockfile; Cargo unifies it with Iced's own, so there is one `wgpu` in the
# build and no second GPU stack. `wgsl` is the shader language used; `naga-ir` lets the photo surface
# hand a spatial pass's module over as the `naga` module it validated, compacted to its entry point,
# so the driver compiles only what the pass runs. It names the `naga` already in the build and adds
# no package.
wgpu = { version = "=27.0.1", default-features = false, features = ["wgsl", "naga-ir"] }
# The WGSL front end and validator `wgpu` 27.0.1 resolves to, pinned to the version already in the
# lockfile so it adds no package. Only `luxforge-core`'s tests name it, as a dev-dependency, to
# validate the GPU programs the core ships as WGSL text; the core itself names no GPU crate.
naga = { version = "=27.0.3", default-features = false }
# The renderer crate behind `iced::Renderer`, for one trait: `primitive::Renderer`, through which the
# photo surface's own widget hands the renderer only the visible part of the photograph instead of
# its whole zoomed box. Iced 0.14 hides it for the same reason as `wgpu` above, so it is named here
# and pinned to the version already in the lockfile; Cargo unifies it with Iced's own and no
# feature is added.
iced_wgpu = { version = "=0.14.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

# The dev profile is what `cargo test` and `cargo xtask` build with, and the tests run real pixel
# loops: on the owner's M4 the slowest test binaries took about 145 s at opt-level 0 and 17 s at 1.
# Debug assertions and overflow checks stay on. Dependencies build without debug info, which keeps a
# new worktree's first test build near 100 s; the workspace crates keep theirs. See
# docs/engineering/development.md#test-and-debug-builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
debug = false
