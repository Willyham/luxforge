[workspace]
members = ["crates/lightwell-raw", "crates/lightwell-core", "crates/lightwell-ui", "crates/lightwell-app", "xtask"]
exclude = ["probes/s0", "probes/raw"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.94"
publish = false

[workspace.dependencies]
image = { version = "=0.25.9", default-features = false, features = ["jpeg", "png"] }
moxcms = { version = "=0.7.11", default-features = false }
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "canvas", "image-without-codecs", "sysinfo", "tokio", "x11", "wayland"] }
rfd = { version = "=0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }
rayon = "=1.12.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
uuid = { version = "=1.26.1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
