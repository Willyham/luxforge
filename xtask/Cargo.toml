[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
xtask-cli = { path = "cli" }
regex.workspace = true
percent-encoding.workspace = true
time.workspace = true
roxmltree.workspace = true
serde.workspace = true
serde_json.workspace = true
# The `mcp` scenario: the attached pictures' base64 and the vendored MCP schemas its checks hold
# the adapters' messages to.
base64.workspace = true
jsonschema.workspace = true
image = { workspace = true, features = ["jpeg"] }
image-webp.workspace = true
kamadak-exif.workspace = true
tiff.workspace = true
luxforge-core = { path = "../crates/luxforge-core" }
luxforge-evidence = { path = "../crates/luxforge-evidence" }
luxforge-raw = { path = "../crates/luxforge-raw" }
luxforge-reference = { path = "../crates/luxforge-reference" }
luxforge-testbase = { path = "../crates/luxforge-testbase" }
luxforge-testkit = { path = "../crates/luxforge-testkit" }
luxforge-update = { path = "../crates/luxforge-update" }
# `module-package` and `module-check`: building a module crate into its component and running it
# on the module engine, `luxforge-wasm` (the SDK's `host` tooling); checking its WGSL program as
# the host registers it, and running it on the local adapter in the host's probe harness through
# `wgpu` (`luxforge-gpu`'s `external_program`, adapter choice and device).
luxforge-module-sdk = { path = "../crates/luxforge-module-sdk", features = ["host"] }
luxforge-gpu = { path = "../crates/luxforge-gpu" }
wgpu.workspace = true
sha2.workspace = true
tempfile = "=3.27.0"
flate2 = "=1.1.10"
tar = "=0.4.46"
zip = { version = "=9.0.4", default-features = false, features = ["deflate-flate2"] }
# Decompresses the pinned prebuilt ONNX Runtime archives the source archive carries
# (`release-source`), with the features `ort-sys`'s build script already builds it with.
lzma-rust2 = { version = "=0.15.8", default-features = false, features = ["std", "optimization"] }

# Hardware SHA-256 on aarch64; the reason is in `crates/luxforge-raw/Cargo.toml`.
[target.'cfg(all(target_arch = "aarch64", not(target_os = "windows")))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
luxforge-test-macros = { path = "../crates/luxforge-test-macros" }
# The core with the disk flush skipped, for this crate's tests only (luxforge-core's
# `test-skip-disk-flush`).
luxforge-core = { path = "../crates/luxforge-core", features = ["test-skip-disk-flush"] }
