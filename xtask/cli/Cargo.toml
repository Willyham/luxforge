[package]
name = "xtask-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde_json.workspace = true
regex.workspace = true
percent-encoding.workspace = true
tempfile = "=3.27.0"
time.workspace = true
semver.workspace = true
sha2.workspace = true
# The update records and feeds `update-record` and `update-feed` write.
luxforge-update = { path = "../../crates/luxforge-update" }
zeroize.workspace = true
# The deploy archive `update-feed --deploy` writes; the version the update crate already pins.
tar = { version = "=0.4.46", default-features = false }

[target.'cfg(all(target_arch = "aarch64", not(target_os = "windows")))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
luxforge-test-macros = { path = "../../crates/luxforge-test-macros" }
