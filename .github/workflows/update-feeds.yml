name: Update feeds
# Regenerates every target's appcast from the update records of all published releases and
# publishes them to the API's update store (docs/design/auto-update.md#publishing-the-feeds). It
# runs after each successful Release builds run, and by hand from main after a withdrawal. It can
# only read the repository, so a failed publication never alters a release.
on:
  workflow_run:
    workflows: [Release builds]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-feeds
  cancel-in-progress: false
jobs:
  feeds:
    if: >-
      vars.LUXFORGE_PUBLISH_UPDATES == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Build the feed tool
        run: cargo build --locked -p xtask-cli
      - name: Collect the published releases and their update records
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/records"
          gh api --paginate --slurp "repos/$GH_REPO/releases" > "$RUNNER_TEMP/published.json"
          jq -r '.[][] | select(.draft == false and .published_at != null) | .tag_name as $tag
            | .assets[] | select(.state == "uploaded" and (.name | test("^luxforge-[0-9A-Za-z.+-]+-updates\\.json$")))
            | [$tag, .name] | @tsv' "$RUNNER_TEMP/published.json" |
            while IFS=$'\t' read -r tag name; do
              gh release download "$tag" --pattern "$name" --dir "$RUNNER_TEMP/records"
            done
      - name: Generate the feeds and the deploy archive
        run: >-
          target/debug/xtask-cli update-feed --records "$RUNNER_TEMP/records"
          --published "$RUNNER_TEMP/published.json" --repository "$GITHUB_REPOSITORY"
          --output "$RUNNER_TEMP/feeds" --deploy "$RUNNER_TEMP/luxforge-update-feeds.tar"
      - name: Retain the deploy archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: update-feeds
          path: ${{ runner.temp }}/luxforge-update-feeds.tar
          if-no-files-found: error
          retention-days: 30
      # Only this step receives the publication key. On the API host the key's forced command is
      # install-feeds.py, so it can do nothing but install a deploy archive into the update store.
      - name: Publish the feeds to the update store
        env:
          LUXFORGE_UPDATE_PUBLISH_SSH_KEY: ${{ secrets.LUXFORGE_UPDATE_PUBLISH_SSH_KEY }}
          PUBLISH_DESTINATION: ${{ vars.LUXFORGE_UPDATE_PUBLISH_DESTINATION }}
          PUBLISH_KNOWN_HOSTS: ${{ vars.LUXFORGE_UPDATE_PUBLISH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in LUXFORGE_UPDATE_PUBLISH_SSH_KEY PUBLISH_DESTINATION PUBLISH_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then echo "Missing publication setting: $name" >&2; exit 1; fi
          done
          case "$PUBLISH_DESTINATION" in ssh://*) ;; *) echo 'LUXFORGE_UPDATE_PUBLISH_DESTINATION must be ssh://USER@HOST[:PORT]' >&2; exit 1 ;; esac
          ssh_dir="$RUNNER_TEMP/luxforge-publication"
          trap 'rm -rf "$ssh_dir"' EXIT
          (umask 077 && mkdir "$ssh_dir" && printf '%s\n' "$LUXFORGE_UPDATE_PUBLISH_SSH_KEY" > "$ssh_dir/key" && printf '%s\n' "$PUBLISH_KNOWN_HOSTS" > "$ssh_dir/known_hosts")
          unset LUXFORGE_UPDATE_PUBLISH_SSH_KEY
          ssh -F /dev/null -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$PUBLISH_DESTINATION" < "$RUNNER_TEMP/luxforge-update-feeds.tar"
