name: Update feeds
# Regenerates every target's appcast from the update records of all published releases and
# publishes them over HTTPS to the API's update store
# (docs/design/auto-update.md#publishing-the-feeds). It runs after each successful Release builds
# run, and by hand from main after a withdrawal. It can only read the repository, so a failed
# publication never alters a release.
on:
  workflow_run:
    workflows: [Release builds]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-feeds
  cancel-in-progress: false
jobs:
  feeds:
    if: >-
      vars.LUXFORGE_PUBLISH_UPDATES == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Build the feed tool
        run: cargo build --locked -p xtask-cli
      - name: Collect the published releases and their update records
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/records"
          gh api --paginate --slurp "repos/$GH_REPO/releases" > "$RUNNER_TEMP/published.json"
          jq -r '.[][] | select(.draft == false and .published_at != null) | .tag_name as $tag
            | .assets[] | select(.state == "uploaded" and (.name | test("^luxforge-[0-9A-Za-z.+-]+-updates\\.json$")))
            | [$tag, .name] | @tsv' "$RUNNER_TEMP/published.json" |
            while IFS=$'\t' read -r tag name; do
              gh release download "$tag" --pattern "$name" --dir "$RUNNER_TEMP/records"
            done
      - name: Generate the feeds and the deploy archive
        run: >-
          target/debug/xtask-cli update-feed --records "$RUNNER_TEMP/records"
          --published "$RUNNER_TEMP/published.json" --repository "$GITHUB_REPOSITORY"
          --output "$RUNNER_TEMP/feeds" --deploy "$RUNNER_TEMP/luxforge-update-feeds.tar"
      - name: Retain the deploy archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: update-feeds
          path: ${{ runner.temp }}/luxforge-update-feeds.tar
          if-no-files-found: error
          retention-days: 30
      # Only this step receives the publication token, which the API's updates Worker accepts for
      # nothing but installing a deploy archive into the update store. It posts the archive to the
      # publications route beside the feeds (release/update.json's feed_base_url), keeping the token
      # off the command line, and the Worker answers `installed feeds-…` or why it refused.
      - name: Publish the feeds to the update store
        env:
          LUXFORGE_UPDATE_PUBLISH_TOKEN: ${{ secrets.LUXFORGE_UPDATE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$LUXFORGE_UPDATE_PUBLISH_TOKEN" ]]; then echo 'Missing publication setting: LUXFORGE_UPDATE_PUBLISH_TOKEN' >&2; exit 1; fi
          base=$(jq -r .feed_base_url release/update.json)
          case "$base" in https://*) ;; *) echo "release/update.json's feed_base_url must be https://, not $base" >&2; exit 1 ;; esac
          header="$RUNNER_TEMP/luxforge-publication-header"
          trap 'rm -f "$header"' EXIT
          (umask 077 && printf 'Authorization: Bearer %s\n' "$LUXFORGE_UPDATE_PUBLISH_TOKEN" > "$header")
          unset LUXFORGE_UPDATE_PUBLISH_TOKEN
          curl --fail-with-body -sS --proto '=https' --tlsv1.2 --max-time 120 -X POST \
            -H @"$header" -H 'content-type: application/x-tar' \
            --data-binary @"$RUNNER_TEMP/luxforge-update-feeds.tar" "${base%/}/publications"
