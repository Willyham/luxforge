name: Release builds
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (v0.1, v0.1.2, or a SemVer prerelease)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      revision: ${{ steps.tag.outputs.revision }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Validate and normalize tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SIGN_MACOS: ${{ vars.LUXFORGE_SIGN_MACOS }}
          PUBLISH_UPDATES: ${{ vars.LUXFORGE_PUBLISH_UPDATES }}
        run: |
          set -euo pipefail
          case "$SIGN_MACOS" in ''|true|false) ;; *) echo 'LUXFORGE_SIGN_MACOS must be true, false, or unset' >&2; exit 1 ;; esac
          case "$PUBLISH_UPDATES" in ''|true|false) ;; *) echo 'LUXFORGE_PUBLISH_UPDATES must be true, false, or unset' >&2; exit 1 ;; esac
          cargo xtask release-tag --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  # The same checks the release command runs locally, on each release platform. They run beside
  # the build rather than before it, and publication needs them both.
  checks:
    needs: identity
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.identity.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libx11-dev libxkbcommon-dev libwayland-dev libvulkan-dev
      - name: Native compiler cache identity
        id: compiler
        shell: bash
        run: |
          { cc --version; c++ --version; if [[ "$RUNNER_OS" == macOS ]]; then xcrun --show-sdk-version; fi; } > "$RUNNER_TEMP/luxforge-compiler.txt"
          echo "key=$(git hash-object "$RUNNER_TEMP/luxforge-compiler.txt")" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          key: release-checks-${{ matrix.os }}-${{ steps.compiler.outputs.key }}
      - name: Quick checks
        run: cargo xtask check --quick
      - name: Native watcher delivery and recovery gate
        run: cargo xtask test --native-watchers
  # Notarization waits on Apple, up to 30 minutes for each of its two submissions.
  build:
    needs: identity
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.identity.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libx11-dev libxkbcommon-dev libwayland-dev libvulkan-dev
      - name: Native compiler cache identity
        id: compiler
        shell: bash
        run: |
          { cc --version; c++ --version; if [[ "$RUNNER_OS" == macOS ]]; then xcrun --show-sdk-version; fi; } > "$RUNNER_TEMP/luxforge-compiler.txt"
          echo "key=$(git hash-object "$RUNNER_TEMP/luxforge-compiler.txt")" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          key: release-${{ matrix.os }}-${{ steps.compiler.outputs.key }}
      - name: Build versioned package
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: cargo xtask release-build --tag "$RELEASE_TAG" --build-number "$GITHUB_RUN_NUMBER" --output artifacts/release
      # This step receives Apple secrets only after the credential-free build finishes.
      # The local Mac's Keychain is never read or exported by this workflow.
      - name: Sign, notarize and staple macOS candidate
        if: runner.os == 'macOS' && vars.LUXFORGE_SIGN_MACOS == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "Missing signing secret: $name" >&2; exit 1; fi
          done
          signing_keychain="$RUNNER_TEMP/luxforge-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/luxforge-certificate.p12"
          cleanup() { security delete-keychain "$signing_keychain" >/dev/null 2>&1 || true; rm -f "$certificate_path"; }
          trap cleanup EXIT
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 3600 "$signing_keychain"
          security unlock-keychain -p "$keychain_password" "$signing_keychain"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$signing_keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$signing_keychain" >/dev/null
          security list-keychains -d user -s "$signing_keychain"
          xcrun notarytool store-credentials luxforge-notarization --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$signing_keychain"
          cargo xtask release-sign --output artifacts/release --identity "$MACOS_SIGNING_IDENTITY" --keychain-profile luxforge-notarization --keychain "$signing_keychain"
      - name: Remove temporary signing credentials
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/luxforge-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/luxforge-certificate.p12"
      - name: Retain finalized build candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.platform }}
          path: |
            artifacts/release/luxforge-*.zip
            artifacts/release/luxforge-*.dmg
            artifacts/release/luxforge-*.tar.gz
            artifacts/release/target.json
          if-no-files-found: error
          retention-days: 30
  # The complete corresponding source of the same commit. This job receives no secrets.
  source:
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.identity.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Linux build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libx11-dev libxkbcommon-dev libwayland-dev libvulkan-dev
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          key: release-source
      - name: Build the source archive
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: cargo xtask release-source --tag "$RELEASE_TAG" --output artifacts/source
      - name: Retain the source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source
          path: |
            artifacts/source/luxforge-*-source.tar.gz
            artifacts/source/source.json
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: [identity, checks, build, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.identity.outputs.revision }}
          persist-credentials: false
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts/downloads
      - name: Verify and assemble every build candidate and the source archive
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: cargo xtask release-assemble --tag "$RELEASE_TAG" --input artifacts/downloads --output dist
      # Built here, without the key, so that the signing step compiles and runs no build script.
      - name: Build the update record tool
        if: vars.LUXFORGE_PUBLISH_UPDATES == 'true'
        run: cargo build --locked -p xtask-cli
      # Only this step receives the update signing key, after every candidate is verified and
      # before anything is published. It signs the final archives into
      # luxforge-VERSION-updates.json, which is uploaded with the other assets; a macOS build that is
      # not notarized is left out of the record. The key exists only in a private temporary file.
      - name: Sign the update record
        if: vars.LUXFORGE_PUBLISH_UPDATES == 'true'
        env:
          LUXFORGE_UPDATE_SIGNING_KEY: ${{ secrets.LUXFORGE_UPDATE_SIGNING_KEY }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$LUXFORGE_UPDATE_SIGNING_KEY" ]]; then echo 'Missing secret: LUXFORGE_UPDATE_SIGNING_KEY' >&2; exit 1; fi
          if ! jq -e '.public_key | type == "string"' release/update.json >/dev/null; then
            echo 'release/update.json commits no public key; commit it before publishing updates' >&2; exit 1
          fi
          key_file="$RUNNER_TEMP/luxforge-update-key"
          trap 'rm -f "$key_file"' EXIT
          (umask 077 && printf '%s' "$LUXFORGE_UPDATE_SIGNING_KEY" > "$key_file")
          unset LUXFORGE_UPDATE_SIGNING_KEY
          target/debug/xtask-cli update-record --tag "$RELEASE_TAG" --input artifacts/downloads --output "dist/luxforge-$RELEASE_VERSION-updates.json" --key-file "$key_file"
      # Signed by this repository's workflow through Sigstore; OmaStore shows it as build provenance.
      - name: Attest the downloads' build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/luxforge-*.dmg
            dist/luxforge-*.zip
            dist/luxforge-*.tar.gz
      - name: Upload all assets and automatically publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          RELEASE_REVISION: ${{ needs.identity.outputs.revision }}
        run: |
          set -euo pipefail
          verify_tag() {
            local remote_revision
            remote_revision="$(gh api "repos/$GH_REPO/commits/refs/tags/$RELEASE_TAG" --jq .sha)"
            if [[ "$remote_revision" != "$RELEASE_REVISION" ]]; then echo 'Release tag moved during the build; refusing publication' >&2; return 1; fi
          }
          verify_tag
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --prerelease --title "Luxforge $RELEASE_VERSION" --notes-file dist/release-notes.md
          verify_tag
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
