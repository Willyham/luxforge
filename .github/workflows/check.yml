name: Build and verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  # What each lane proves, and what it never proves, is the development guide's CI section
  # (docs/engineering/development.md#ci). No lane here is native GPU evidence.
  native-build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Windows CI is disabled for now; Windows support will come later.
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libxkbcommon-dev libwayland-dev libvulkan-dev
      - name: Pinned toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Headless checks, slow tests and doctests included (macOS, on the hosted VM's own adapter)
        if: runner.os != 'Linux'
        run: cargo xtask check
      # The no-adapter lane: every Vulkan and EGL driver is hidden from the loaders, so the
      # reference renderer's tests and the owner journeys run with no graphics adapter at all and
      # the GPU tests skip, saying so. The lane's own record of having no adapter is below.
      - name: Headless checks with no graphics adapter (Linux, every driver hidden), slow tests and doctests included
        if: runner.os == 'Linux'
        run: cargo xtask check
        env:
          VK_DRIVER_FILES: /nonexistent/vulkan-icd.json
          VK_ICD_FILENAMES: /nonexistent/vulkan-icd.json
          __EGL_VENDOR_LIBRARY_FILENAMES: /nonexistent/egl-vendor.json
      - name: Offline sample corpus tooling
        run: python3 -m unittest discover -s tools -p 'test_sample_corpus.py' -v
      - name: Editor acceptance in release (macOS)
        if: runner.os != 'Linux'
        run: cargo run --release --locked --package xtask -- editor-acceptance --output artifacts/editor-acceptance
      - name: Editor acceptance in release with no graphics adapter (Linux, every driver hidden)
        if: runner.os == 'Linux'
        run: cargo run --release --locked --package xtask -- editor-acceptance --output artifacts/editor-acceptance
        env:
          VK_DRIVER_FILES: /nonexistent/vulkan-icd.json
          VK_ICD_FILENAMES: /nonexistent/vulkan-icd.json
          __EGL_VENDOR_LIBRARY_FILENAMES: /nonexistent/egl-vendor.json
      - name: Optimized native build
        run: cargo xtask build --release
      - name: Local development artifact and notices
        run: cargo xtask package --output artifacts/package
      - name: Linux runtime imports
        if: runner.os == 'Linux'
        run: ldd artifacts/package/Luxforge/luxforge | tee artifacts/package/runtime-imports.txt
      - name: Graphics adapters the hosted VM exposes (macOS, recorded; not native GPU evidence)
        if: runner.os != 'Linux'
        run: |
          target/release/luxforge --gpu-adapters > artifacts/gpu-adapters.jsonl
          cat artifacts/gpu-adapters.jsonl
      # The no-adapter lane's record: the editor's own enumeration, with the same drivers hidden,
      # finds no adapter. A runner that offers one fails here rather than passing as no-adapter.
      - name: No graphics adapter with every driver hidden (Linux)
        if: runner.os == 'Linux'
        run: |
          artifacts/package/Luxforge/luxforge --gpu-adapters > artifacts/gpu-adapters-none.jsonl
          cat artifacts/gpu-adapters-none.jsonl
          test ! -s artifacts/gpu-adapters-none.jsonl
        env:
          VK_DRIVER_FILES: /nonexistent/vulkan-icd.json
          VK_ICD_FILENAMES: /nonexistent/vulkan-icd.json
          __EGL_VENDOR_LIBRARY_FILENAMES: /nonexistent/egl-vendor.json
      # The software-adapter lane: rendered journeys under Xvfb through Mesa's lavapipe, a Vulkan
      # rasterizer on the CPU. Functional evidence only, never native GPU evidence.
      - name: Linux rendered journeys through the software Vulkan adapter (lavapipe), each run's adapter recorded and checked
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb mesa-vulkan-drivers libxkbcommon-x11-0
          # The adapters the editor's renderer chooses among on this lane: lavapipe alone, a CPU one.
          artifacts/package/Luxforge/luxforge --gpu-adapters > artifacts/gpu-adapters-lavapipe.jsonl
          cat artifacts/gpu-adapters-lavapipe.jsonl
          jq -e -s 'length > 0 and all(.[]; .device_type == "Cpu")' artifacts/gpu-adapters-lavapipe.jsonl
          cargo xtask generate-fixtures
          # Kept explicit: `smoke --list` marks what needs a supplied RAW ("not in rendered") but not
          # what runs on software Vulkan, and only these are run here: the original renderer smoke,
          # the histogram, the GPU stage's identity frame, gestures drawn on the GPU stage, and a
          # launch with the GPU stage refused. A name `smoke --list` does not have fails the step.
          # Lavapipe is not adopted as the fallback for a host without a hardware adapter
          # (docs/specs/performance.md, "Software adapters"), so the editor refuses the GPU stage
          # on this lane unless asked: every launch passes --software-adapter to draw on it.
          for scenario in empty load replacement invalid repeated alternating large24 large60 histogram gpu-identity gpu-preview no-gpu-render; do
            xvfb-run -a cargo xtask smoke --binary artifacts/package/Luxforge/luxforge --scenario "$scenario" --output "artifacts/headless-$scenario" --editor-software-adapter
          done
          # Every launch's result.json records the adapter that drew it; on this lane each must be
          # the software one.
          for result in artifacts/headless-*/result.json; do
            jq -e '(.launches | length) > 0 and all(.launches[]; .adapter.device_type == "Cpu")' "$result"
          done
        env:
          WGPU_BACKEND: vulkan
          WINIT_UNIX_BACKEND: x11
      - name: Retain development artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: luxforge-${{ matrix.os }}-development
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pinned toolchain and audit tool
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          cargo install --locked --version 0.20.2 --root .tools/cargo-deny cargo-deny
      - name: License, source and advisory policy
        run: cargo xtask audit
