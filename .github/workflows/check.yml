name: Build and verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Windows CI is disabled for now; Windows support will come later.
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libxkbcommon-dev libwayland-dev libvulkan-dev
      - name: Pinned toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Headless checks, slow tests and doctests included
        run: cargo xtask check
      - name: Editor acceptance in release
        run: cargo run --release --locked --package xtask -- editor-acceptance --output artifacts/editor-acceptance
      - name: Optimized native build
        run: cargo xtask build --release
      - name: Local development artifact and notices
        run: cargo xtask package --output artifacts/package
      - name: Linux runtime imports
        if: runner.os == 'Linux'
        run: ldd artifacts/package/Luxforge/luxforge | tee artifacts/package/runtime-imports.txt
      - name: Headless Linux renderer smoke (software Vulkan, not native acceptance)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb mesa-vulkan-drivers libxkbcommon-x11-0
          cargo xtask generate-fixtures
          # The eight scenarios of the original renderer smoke, kept explicit: `smoke --list` marks
          # what needs a supplied RAW ("not in rendered") but not what runs on software Vulkan,
          # and only these eight are run here. A name `smoke --list` does not have
          # fails the step.
          for scenario in empty load replacement invalid repeated alternating large24 large60; do
            xvfb-run -a cargo xtask smoke --binary artifacts/package/Luxforge/luxforge --scenario "$scenario" --output "artifacts/headless-$scenario"
          done
        env:
          WGPU_BACKEND: vulkan
          WINIT_UNIX_BACKEND: x11
      - name: Retain development artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: luxforge-${{ matrix.os }}-development
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pinned toolchain and audit tool
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          cargo install --locked --version 0.20.2 --root .tools/cargo-deny cargo-deny
      - name: License, source and advisory policy
        run: cargo xtask audit
