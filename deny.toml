[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[licenses]
# IJG: the Independent JPEG Group's licence of libjpeg-turbo, which `mozjpeg-sys` bundles for the
# JPEG decoder and encoder (with its Zlib and BSD-3-Clause parts); GPL-compatible, with an
# attribution notice. MIT-0: MIT without its attribution condition.
allow = [
    "GPL-3.0-or-later", "MIT", "MIT-0", "Apache-2.0", "BSL-1.0", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "0BSD", "CC0-1.0", "Unlicense", "Unicode-3.0", "IJG",
]
confidence-threshold = 0.8

# CDLA-Permissive-2.0: the Mozilla root certificates `ureq` bundles with its `native-tls` feature.
# Only `ort-sys`'s build script reaches it, on the TLS of its pinned ONNX Runtime download; no
# shipped binary links it.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
