[package]
name = "luxforge-reference"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The independent f64 references the core's tests and xtask's acceptance check production against.
# It depends on nothing, and above all never on `luxforge-core`: `cargo xtask check-repository`
# refuses a manifest that names it, so a reference can never import the code it checks. Only
# `[dev-dependencies]`, `luxforge-testkit` and xtask name this crate.
[dependencies]

# The studies under `tests/` generate and reload the committed fixture corpora and write review
# images; the references themselves need none of these.
[dev-dependencies]
image.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
