[package]
name = "luxforge-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Test support the workspace's tests and xtask share. Only `[dev-dependencies]` and xtask name this
# crate, so no build of a shipped binary compiles it.
[dependencies]
luxforge-core = { path = "../luxforge-core" }
luxforge-reference = { path = "../luxforge-reference" }
luxforge-testbase = { path = "../luxforge-testbase" }
rustls = { workspace = true, optional = true }
serde_json.workspace = true
sha2.workspace = true

# `tls` lets a `TestServer` serve TLS. Only the transport's own tests (`luxforge-net`) ask for it,
# so a build of the core's tests alone links no TLS crate.
[features]
tls = ["dep:rustls"]

[lints]
workspace = true
