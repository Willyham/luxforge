[package]
name = "luxforge-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Test support that speaks core types, which the workspace's tests and xtask share. Only
# `[dev-dependencies]` and xtask name this crate, so no build of a shipped binary compiles it, and
# `luxforge-core` never does: its integration tests compile `client` and `fixtures` in through
# `#[path]` modules, so a core test build compiles the core once.
[dependencies]
luxforge-core = { path = "../luxforge-core" }
luxforge-reference = { path = "../luxforge-reference" }
luxforge-testbase = { path = "../luxforge-testbase" }
serde_json.workspace = true
sha2.workspace = true

# Hardware SHA-256 on aarch64; the reason is in `crates/luxforge-raw/Cargo.toml`.
[target.'cfg(all(target_arch = "aarch64", not(target_os = "windows")))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
# The core with the disk flush skipped, for this crate's tests only (luxforge-core's
# `test-skip-disk-flush`).
luxforge-core = { path = "../luxforge-core", features = ["test-skip-disk-flush"] }

[lints]
workspace = true
