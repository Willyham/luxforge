[package]
name = "lightwell-process"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true

# Every platform dependency is already in the lockfile, pinned here to the version it resolves to,
# so reading the process's own counters adds no package.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
objc2 = "=0.6.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

# This crate contains locally documented FFI to the operating system's process accounting. It is
# the second crate allowed `unsafe`, after `lightwell-raw`; the rest of the workspace retains its
# forbid(unsafe_code) policy.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
