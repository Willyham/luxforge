[package]
name = "luxforge-net"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The host's network transport and secure secret store, behind the core's `Transport` and
# `SecretStore` traits. Only the desktop and `luxforge-json` depend on it, and give its
# implementations to the catalog owner through `HostConfig`, so `luxforge-core` and its test
# binaries link no TLS, HTTP or Keychain crate.
[dependencies]
luxforge-core = { path = "../luxforge-core" }
rustls.workspace = true
rustls-platform-verifier.workspace = true
ureq.workspace = true
ureq-proto.workspace = true
url.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[dev-dependencies]
luxforge-test-macros = { path = "../luxforge-test-macros" }
luxforge-testbase = { path = "../luxforge-testbase", features = ["tls"] }
# The core with the disk flush skipped, for this crate's tests only (luxforge-core's
# `test-skip-disk-flush`).
luxforge-core = { path = "../luxforge-core", features = ["test-skip-disk-flush"] }
# The counting allocator the `usage_overhead` binary installs to measure the transport's heap.
luxforge-process = { path = "../luxforge-process", features = ["allocation-counter"] }
serde_json.workspace = true

[lints]
workspace = true
