[package]
name = "luxforge-net"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The host's network transport and secure secret store, behind the core's `Transport` and
# `SecretStore` traits. Only the desktop and `luxforge-json` depend on it, and give its
# implementations to the catalog owner through `HostConfig`, so `luxforge-core` and its test
# binaries link no TLS, HTTP or Keychain crate.
[dependencies]
luxforge-core = { path = "../luxforge-core" }
rustls.workspace = true
rustls-platform-verifier.workspace = true
ureq.workspace = true
ureq-proto.workspace = true
url.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[dev-dependencies]
luxforge-testbase = { path = "../luxforge-testbase" }
luxforge-testkit = { path = "../luxforge-testkit", features = ["tls"] }

[lints]
workspace = true
