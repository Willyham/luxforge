[package]
name = "lightwell-app"
default-run = "lightwell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "lightwell"
path = "src/main.rs"

[[bin]]
name = "lightwell-json"
path = "src/json.rs"

[dependencies]
lightwell-core = { path = "../lightwell-core" }
lightwell-evidence = { path = "../lightwell-evidence" }
lightwell-ui = { path = "../lightwell-ui" }
iced.workspace = true
# Iced 0.14 gates its public allocation re-export on codec-enabled image support.
# Use the already-resolved runtime directly to keep JPEG-only decoding.
iced_runtime = "=0.14.0"
image.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[dev-dependencies]
lightwell-testkit = { path = "../lightwell-testkit" }

[lints]
workspace = true
