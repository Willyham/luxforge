[package]
name = "luxforge-jpeg"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The one crate that names the JPEG codec. It depends on no workspace crate; `luxforge-core` alone
# depends on it, which `cargo xtask check-repository` enforces.
[dependencies]
mozjpeg.workspace = true
mozjpeg-sys.workspace = true

[dev-dependencies]
# An independent JPEG decoder for the tests, as the other crates' tests use it.
image = { workspace = true, features = ["jpeg"] }
serde_json.workspace = true
sha2.workspace = true

# Hardware SHA-256 on aarch64 for the tests' digests, so that every build resolves one `sha2`; the
# reason is in `crates/luxforge-raw/Cargo.toml`.
[target.'cfg(all(target_arch = "aarch64", not(target_os = "windows")))'.dev-dependencies]
sha2 = { workspace = true, features = ["asm"] }

# `unsafe` is allowed by name only on the functions that need it, each block beside its `SAFETY:`
# comment: in `decode.rs`, the one read of libjpeg's warning code through the error manager's raw
# pointer; in `session.rs`, the region decode's own libjpeg session over `mozjpeg-sys` (creating,
# reading, cropping, skipping and destroying it, and reading the segments it saved), since
# `mozjpeg`'s safe API cannot crop or skip. The crate denies `unsafe` everywhere else, and the rest
# of the workspace keeps its forbid(unsafe_code) policy.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
