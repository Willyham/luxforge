[package]
name = "luxforge-input"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# AppKit fills Iced 0.14's pinch and minimize/hide event gaps. These packages already occur in
# the lockfile; request the input, window/app lifecycle and KVO/notification bindings only.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSEvent", "NSWindow", "NSView", "NSResponder", "NSApplication", "NSRunningApplication", "block2", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSDictionary", "NSNotification", "NSKeyValueObserving", "NSOperation", "block2"] }
block2 = "=0.6.2"
raw-window-handle = "=0.6.2"

# Only this native event boundary may dereference AppKit's borrowed handle and callback argument.
# Its public API passes copied facts, never native pointers, and owns no editing or catalog state.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
