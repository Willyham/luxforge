[package]
name = "luxforge-watch"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The platform's change notifications for watched folders and mounted volumes, and the mount table.
# It depends on no workspace crate, which `cargo xtask check-repository` enforces; `luxforge-core`'s
# index uses it.
[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2.workspace = true
# Already in the lockfile, pinned here to the version it resolves to, as `luxforge-process` does.
libc = "=0.2.189"
objc2-core-foundation.workspace = true
objc2-core-services.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

# Already in the lockfile; the features are the directory change reads, the completion port, and the
# configuration manager's volume notifications.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
luxforge-testbase = { path = "../luxforge-testbase" }

# This crate holds locally documented FFI to the platform's file system notifications (FSEvents and
# Disk Arbitration on macOS, the directory change reads, completion port and configuration manager on
# Windows) and to the macOS mount table. Only the modules that call them hold `unsafe`; the others,
# the Linux watcher among them, forbid it. The rest of the workspace retains its forbid(unsafe_code)
# policy.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
