[package]
name = "luxforge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "luxforge-json"
path = "src/json.rs"

[[bin]]
name = "luxforge-ctl"
path = "src/ctl.rs"

[[bin]]
name = "luxforge-mcp"
path = "src/luxforge_mcp.rs"

[dependencies]
luxforge-core = { path = "../luxforge-core" }
luxforge-net = { path = "../luxforge-net" }
luxforge-onnx = { path = "../luxforge-onnx" }
luxforge-diffusion = { path = "../luxforge-diffusion" }
# The WebAssembly engine external modules run in, for the desktop and `luxforge-json` alike.
luxforge-wasm = { path = "../luxforge-wasm" }
# The MCP adapter's attached pictures, base64-encoded in image content.
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
# Cross-checks the MCP adapter's generated input schemas against the 2020-12 metaschema and its own
# request check; never a dependency of a binary.
jsonschema.workspace = true
# An independent MCP client of the real luxforge-mcp, used by one integration test only
# (`tests/mcp/interop.rs`), on a current-thread runtime of the Tokio the workspace already locks.
rmcp.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "process"] }
luxforge-test-macros = { path = "../luxforge-test-macros" }
luxforge-reference = { path = "../luxforge-reference" }
luxforge-testbase = { path = "../luxforge-testbase" }
luxforge-testkit = { path = "../luxforge-testkit" }
# The installed-module tests' packages (`tests/json_cli/modules.rs`): `luxforge-wasm`'s test
# component, assembled from WAT and wrapped by `wit-component` at the versions that crate pins, and
# zipped as a `.lfmodule`.
sha2.workspace = true
wat = "=1.258.3"
wit-component = "=0.258.3"
wit-parser = "=0.258.3"
zip = { version = "=9.0.4", default-features = false, features = ["deflate-flate2"] }
# The core with the disk flush skipped and its source worker holdable, for this crate's tests only
# (luxforge-core's `test-skip-disk-flush` and `test-holds`).
luxforge-core = { path = "../luxforge-core", features = ["test-skip-disk-flush", "test-holds"] }

[lints]
workspace = true
