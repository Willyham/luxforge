[package]
name = "luxforge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "luxforge-json"
path = "src/json.rs"

[[bin]]
name = "luxforge-ctl"
path = "src/ctl.rs"

[dependencies]
luxforge-core = { path = "../luxforge-core" }
luxforge-net = { path = "../luxforge-net" }
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
luxforge-reference = { path = "../luxforge-reference" }
luxforge-testbase = { path = "../luxforge-testbase" }
luxforge-testkit = { path = "../luxforge-testkit" }
# The core with the disk flush skipped, for this crate's tests only (luxforge-core's
# `test-skip-disk-flush`).
luxforge-core = { path = "../luxforge-core", features = ["test-skip-disk-flush"] }

[lints]
workspace = true
