[package]
name = "luxforge-install"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Where the running macOS app bundle is installed, and moving it into Applications
# (docs/design/auto-update.md#moving-into-applications): the location the launch question and the
# update port read, the copy, verification and replacement a move makes, and the relaunch from the
# new place once the running app has quit. It depends on no workspace crate; off macOS it is empty.
[dependencies]

# Already in the lockfile, pinned to the versions they resolve to: the mount table and extended
# attributes through `libc`, the Trash through Foundation's file manager, and CoreFoundation
# strings for the disk description Disk Arbitration answers.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"
objc2-core-foundation.workspace = true
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[dev-dependencies]
luxforge-test-macros = { path = "../luxforge-test-macros" }
luxforge-testbase = { path = "../luxforge-testbase" }

# `unsafe` is allowed in one module only, `macos/native.rs`, beside each call's `SAFETY:` comment:
# `statfs`, `access` and the extended attribute calls, Disk Arbitration's disk description, and
# Security's translocation functions, looked up with `dlsym` because they are not public API. The
# crate denies it everywhere else, and the rest of the workspace keeps its forbid(unsafe_code)
# policy.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
