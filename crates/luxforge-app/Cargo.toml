[package]
name = "luxforge-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "luxforge"
path = "src/main.rs"

[dependencies]
luxforge-cli = { path = "../luxforge-cli" }
luxforge-core = { path = "../luxforge-core" }
luxforge-evidence = { path = "../luxforge-evidence" }
luxforge-net = { path = "../luxforge-net" }
luxforge-ui = { path = "../luxforge-ui" }
luxforge-input = { path = "../luxforge-input" }
iced.workspace = true
image.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# An independent JPEG decoder for the export tests.
image = { workspace = true, features = ["jpeg"] }
luxforge-testbase = { path = "../luxforge-testbase" }
luxforge-testkit = { path = "../luxforge-testkit" }
# The core with the disk flush skipped and its index listings held at a test's gate, for this
# crate's tests only (luxforge-core's `test-skip-disk-flush` and `test-holds`).
luxforge-core = { path = "../luxforge-core", features = ["test-skip-disk-flush", "test-holds"] }

[lints]
workspace = true
