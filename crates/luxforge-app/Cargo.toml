[package]
name = "luxforge-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "luxforge"
path = "src/main.rs"

[dependencies]
luxforge-cli = { path = "../luxforge-cli" }
luxforge-core = { path = "../luxforge-core" }
luxforge-evidence = { path = "../luxforge-evidence" }
luxforge-net = { path = "../luxforge-net" }
luxforge-ui = { path = "../luxforge-ui" }
iced.workspace = true
image.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[dev-dependencies]
# An independent JPEG decoder for the export tests.
image = { workspace = true, features = ["jpeg"] }
luxforge-testbase = { path = "../luxforge-testbase" }
luxforge-testkit = { path = "../luxforge-testkit" }

[lints]
workspace = true
