[package]
name = "luxforge-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "luxforge"
path = "src/main.rs"

[dependencies]
luxforge-cli = { path = "../luxforge-cli" }
luxforge-core = { path = "../luxforge-core" }
luxforge-gpu = { path = "../luxforge-gpu" }
luxforge-evidence = { path = "../luxforge-evidence" }
luxforge-net = { path = "../luxforge-net" }
luxforge-onnx = { path = "../luxforge-onnx" }
luxforge-diffusion = { path = "../luxforge-diffusion" }
luxforge-update = { path = "../luxforge-update" }
luxforge-sparkle = { path = "../luxforge-sparkle" }
luxforge-ui = { path = "../luxforge-ui" }
luxforge-input = { path = "../luxforge-input" }
luxforge-install = { path = "../luxforge-install" }
luxforge-process = { path = "../luxforge-process" }
# External modules' GPU programs: the launch's registry, and the probe the GPU tile worker runs.
luxforge-wasm = { path = "../luxforge-wasm" }
iced.workspace = true
wgpu.workspace = true
image.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
luxforge-test-macros = { path = "../luxforge-test-macros" }
# A one-thread runtime with a clock, to poll a job reader's stream in a test (`rt` is already on
# through Iced's `tokio` feature).
tokio = { workspace = true, features = ["rt"] }
# An independent JPEG decoder for the export tests.
image = { workspace = true, features = ["jpeg"] }
# The independent sRGB reference and preview-difference measure the GPU programs are qualified by.
luxforge-reference = { path = "../luxforge-reference" }
# The executor with qualification readback, for GPU tests and the corpus harness only.
luxforge-gpu = { path = "../luxforge-gpu", features = ["qualification"] }
luxforge-testbase = { path = "../luxforge-testbase" }
luxforge-testkit = { path = "../luxforge-testkit" }
# Writes the `.lfmodule` packages Settings › Modules' install tests hand the owner.
zip = { version = "=9.0.4", default-features = false }
# Seeds a catalog another version made, with an uncheckpointed write-ahead log, for the
# unsupported-catalog launch's preservation tests.
rusqlite.workspace = true
# The module engine's test components, built in the test from WAT, for the probe tests
# (`app::gpu_probe_tests`): the wasm-tools release Wasmtime 49 reads, as the engine's own tests.
wat = "=1.258.3"
wit-component = "=0.258.3"
wit-parser = "=0.258.3"
sha2.workspace = true
# Fake payloads, signed archives, feeds and an in-memory fetch for the update port's tests.
luxforge-update = { path = "../luxforge-update", features = ["testing"] }
# The core with the disk flush skipped, its index listings held at a test's gate and its Presence
# CPU filters exposed, for this crate's tests only (luxforge-core's `test-skip-disk-flush`,
# `test-holds` and `qualification`).
luxforge-core = { path = "../luxforge-core", features = ["test-skip-disk-flush", "test-holds", "qualification"] }

[lints]
workspace = true
