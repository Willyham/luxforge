[package]
name = "luxforge-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "luxforge_ui"
path = "src/lib.rs"

[dependencies]
luxforge-gpu = { path = "../luxforge-gpu" }
luxforge-gpu-types = { path = "../luxforge-gpu-types" }
iced.workspace = true
iced_wgpu.workspace = true
wgpu.workspace = true
[features]
# Qualification only: `photo_surface::gpu_preview::qualification`, which evaluates a GPU plan on a
# headless device and reads its output back, for the desktop's per-program readback tests and the
# GPU preview corpus harness. Only a `[dev-dependencies]` table may turn it on (`cargo xtask
# check-repository`'s `gpu-qualification-only-in-tests` rule), so no build of the desktop reads a
# GPU pixel back but through the tile runner (`gpu_preview::tiles`) its GPU tile worker owns.
qualification = ["luxforge-gpu/qualification"]

[dev-dependencies]
half = { version = "=2.7.1", default-features = false, features = ["std"] }
luxforge-gpu = { path = "../luxforge-gpu", features = ["qualification"] }
# The one gate and wait. Core-free, so the widget crate, which may not reach the core, can use it.
luxforge-testbase = { path = "../luxforge-testbase" }
# The one independent sRGB transfer function, which the tokens' linear-light composites and the
# tests' linear-light expectations and the GPU stage's identity readback are computed through. It
# depends on no workspace crate, so the widget crate stays core-free.
luxforge-reference = { path = "../luxforge-reference" }
# The process's memory figures, core-free, which the measurement of a boundary's arrival reads.
luxforge-process = { path = "../luxforge-process" }

[lints]
workspace = true
