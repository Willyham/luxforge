[package]
name = "luxforge-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "luxforge_ui"
path = "src/lib.rs"

[dependencies]
iced.workspace = true
iced_wgpu.workspace = true
wgpu.workspace = true
# Half floats for the GPU stage's rgba16float boundary. Already in the build through naga, pinned to
# that version, so it adds no package; no feature is asked for.
half = { version = "=2.7.1", default-features = false }

[dev-dependencies]
# The one gate and wait. Core-free, so the widget crate, which may not reach the core, can use it.
luxforge-testbase = { path = "../luxforge-testbase" }
# The one independent sRGB transfer function, which tests compute linear-light expectations and the
# GPU stage's identity readback through. It depends on no workspace crate, so the widget crate stays
# core-free.
luxforge-reference = { path = "../luxforge-reference" }

[lints]
workspace = true
