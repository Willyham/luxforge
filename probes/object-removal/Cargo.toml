[package]
name = "luxforge-removal-probe"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
default-run = "removal-probe"

# A development probe, not part of the editor's workspace: its dependencies and lockfile are its own.
[workspace]

[dependencies]
# ONNX Runtime through pyke's binding. The default features download pyke's prebuilt static library
# (hash-checked by ort-sys); `coreml` enables the Core ML execution provider on macOS.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-native", "api-24", "coreml"] }
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tract-onnx = "=0.23.8"
tract-metal = "=0.23.8"
tract-core = "=0.23.8"
# The removal-lab window only: the wgpu renderer, a canvas for pointer gestures and overlays, image
# handles without iced's own codecs (the probe decodes), and tokio as the executor, as the editor has.
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "canvas", "image-without-codecs", "tokio"] }

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
