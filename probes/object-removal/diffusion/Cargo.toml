[package]
name = "luxforge-removal-diffusion"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "The harness's generative runtime: luxforge-diffusion's vendored stable-diffusion.cpp and ggml and its binding, compiled from that crate's files."
links = "luxforge_sdcpp"
build = "build.rs"

[dependencies]

[build-dependencies]
cc = { version = "=1.5.1", features = ["parallel"] }

[lints.rust]
# The C ABI is the crate's whole purpose; every unsafe block is in luxforge-diffusion's src/native.rs.
unsafe_op_in_unsafe_fn = "deny"
