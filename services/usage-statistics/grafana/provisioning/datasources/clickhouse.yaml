apiVersion: 1
datasources:
  - name: Luxforge ClickHouse
    uid: luxforge-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      secure: false
      username: luxforge_reader
      defaultDatabase: luxforge
      queryTimeout: 30
    secureJsonData:
      password: $LUXFORGE_CLICKHOUSE_READER_PASSWORD
